name: Image renditions

# Keeps WebP renditions in sync for newly-ingested artworks. The backfill script
# (scripts/generate-image-renditions.mjs) is resumable and skips images that already
# have renditions, so each scheduled run only processes what's new.

on:
  # Schedule removed 22 Sep 2026: renditions are produced by the import jobs
  # straight to R2 (migrate-new-to-r2.mjs), and this job's full listing of the
  # Supabase bucket (514k objects) now exceeds the 30 s statement timeout. Its
  # last successful run produced 11 renditions out of 128k. Kept for manual
  # regeneration of a batch if ever needed.
  workflow_dispatch: {} # manual runs only, from the Actions tab

# Never let two runs overlap (a long run shouldn't collide with the next schedule).
concurrency:
  group: image-renditions
  cancel-in-progress: false

jobs:
  renditions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Generate renditions for new images
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Call the script directly (the npm script uses --env-file=.env.local, which
        # doesn't exist in CI); env comes from repo secrets instead.
        run: node scripts/generate-image-renditions.mjs
