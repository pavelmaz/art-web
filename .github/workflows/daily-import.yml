name: Daily artwork drip import

# Adds missing artworks per day for artists already in the catalog, walking the
# artist list A→Z (cursor in _import_drip_state). Full chain per run:
#   1. import  — import-wikipedia.mjs --drip=75 (dedupe, dims, IndexNow,
#                artist-portrait backfill for touched artists)
#   2. migrate — copy the new images to Cloudflare R2 + build renditions
#                (scripts/migrate-new-to-r2.mjs — R2 only, never Supabase)
#   3. enrich  — grounded Prado-style descriptions + 10-locale translations
# Runs at 02:00 UTC.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-import
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Cap raised 25 → 75. The cursor only advances past an artist once ALL
      # their works are checked, so a prolific artist with more importable works
      # than the cap parks the walk on them indefinitely: every run imports
      # `cap` works, hits the cap mid-artist, and writes the SAME cursor back.
      # That is what froze the A→Z walk on "Abraham Hulk" for 13 days — Abraham
      # Janssens (the next artist) had far more than 25 available. A higher cap
      # drains such artists in one run instead of parking on them.
      - name: Import up to 75 missing artworks (A→Z drip)
        run: node import-wikipedia.mjs --drip=75 --max-artists=150

      # Copy the new works' images to Cloudflare R2 (never Supabase storage) and
      # generate their renditions in the same pass. Replaces the old
      # migrate-external-images edge function, which uploaded to Supabase and so
      # grew the bucket the project keeps flat (memory: storage-egress-lockdown).
      - name: Migrate new images to R2 (+ renditions)
        run: node scripts/migrate-new-to-r2.mjs --since-hours=6 --limit=300

      - name: Enrich (Prado-style descriptions, 10 locales)
        run: |
          BASE="${NEXT_PUBLIC_SUPABASE_URL%/}/functions/v1"
          for i in $(seq 1 20); do
            resp=$(curl -s -m 280 -X POST "$BASE/enrich-artworks" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" -d '{}')
            echo "enrich #$i: $(echo "$resp" | head -c 200)"
            echo "$resp" | grep -q 'need enrichment' && break
            remaining=$(echo "$resp" | grep -oE '"remaining":[0-9]+' | grep -oE '[0-9]+' || echo "")
            [ "$remaining" = "0" ] && break
            sleep 2
          done

      # Safety net: catch any image that finished importing late (renditions are
      # produced inside the migrate step, so this only mops up stragglers).
      - name: Migrate stragglers to R2 (second pass)
        if: always()
        run: node scripts/migrate-new-to-r2.mjs --since-hours=6 --limit=300
