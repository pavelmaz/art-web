name: Daily artwork drip import

# Adds missing artworks per day for artists already in the catalog, walking the
# artist list A→Z (cursor committed to .github/state/drip-cursor.txt — NOT
# Supabase; that table (_import_drip_state) has RLS with zero policies and the
# repo's Supabase key silently couldn't write to it for 7+ weeks (16 Sep 2026),
# freezing the walk on "Albrecht Altdorfer" while the job kept reporting green.
# A committed file fails loudly instead: the push step either succeeds or the
# job goes red). Full chain per run:
#   1. import  — import-wikipedia.mjs --drip=200 (dedupe, dims, IndexNow,
#                artist-portrait backfill for touched artists)
#   2. migrate — copy the new images to Cloudflare R2 + build renditions
#                (scripts/migrate-new-to-r2.mjs — R2 only, never Supabase)
#   3. enrich  — grounded Prado-style descriptions + 10-locale translations
#   4. commit  — push the advanced cursor back to the repo
# Runs at 02:00 UTC.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-import
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the advanced cursor file back

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Re-enabled 22 Sep 2026: Bing is the converting search engine and IndexNow
      # is how it learns about new pages the same day (volume is ~200 URLs/run).
      INDEXNOW_ENABLED: "1"
      # External sources for the A->Z drip (26 Sep 2026): Rijksmuseum needs no key;
      # Europeana activates once EUROPEANA_KEY exists in repo secrets.
      EUROPEANA_KEY: ${{ secrets.EUROPEANA_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Cap raised 75 → 200, scan ceiling 150 → 400 (16 Sep 2026, alongside the
      # cursor-storage fix above — raising the cap alone wouldn't have helped
      # while the cursor couldn't persist at all). The cursor only advances past
      # an artist once ALL their works are checked, so a prolific artist with
      # more importable works than the cap parks the walk on them indefinitely:
      # every run imports `cap` works, hits the cap mid-artist, and never reaches
      # the "save cursor" step for anyone after. That is what froze the walk on
      # "Abraham Hulk" for 13 days before (fixed by raising 25→75) and, combined
      # with the Supabase write failure, on "Albrecht Altdorfer" for 7 weeks.
      - name: Import up to 200 missing artworks (A→Z drip)
        run: node import-wikipedia.mjs --drip=200 --max-artists=400 2>&1 | tee /tmp/drip.log

      # Demand-first slice (22 Sep 2026): a few artists a day from the Wikidata
      # plan, famous-and-missing first, then famous-but-half-covered. The A→Z
      # drip above keeps completing the long tail.
      - name: Plan batch (priority artists from _wiki_import_plan)
        run: |
          node scripts/plan-next-batch.mjs --batch-size=4 --batch-file=/tmp/plan-batch.txt 2>&1 | tee /tmp/plan.log
          if [ -s /tmp/plan-batch.txt ]; then
            node import-wikipedia.mjs --from-file=/tmp/plan-batch.txt --limit=60 2>&1 | tee /tmp/plan-import.log
            sed 's/^wd://' /tmp/plan-batch.txt | paste -sd '|' - > /tmp/plan-batch-names.txt
            NAMES="$(cat /tmp/plan-batch-names.txt)" node backfill-artist-portraits.mjs || true
          else
            echo "Plan batch empty."
          fi

      # Copy the new works' images to Cloudflare R2 (never Supabase storage) and
      # generate their renditions in the same pass. Replaces the old
      # migrate-external-images edge function, which uploaded to Supabase and so
      # grew the bucket the project keeps flat (memory: storage-egress-lockdown).
      - name: Migrate new images to R2 (+ renditions)
        run: node scripts/migrate-new-to-r2.mjs --since-hours=6 --limit=600 2>&1 | tee /tmp/migrate.log

      # migrate-new-to-r2.mjs only selects rows whose image_id is still an
      # external URL — a work whose Commons source was a large TIFF goes
      # straight to Supabase storage at import time (storeTiffOriginal() in
      # import-wikipedia.mjs) and would otherwise never get renditions,
      # showing a correct original but a 404 on every grid/detail/download
      # image forever (16 Sep 2026 incident).
      - name: Rendition backfill for TIFF-sourced imports
        run: node scripts/backfill-r2-renditions-direct.mjs --since-hours=6 --limit=300

      - name: Enrich (Prado-style descriptions, 10 locales)
        run: |
          BASE="${NEXT_PUBLIC_SUPABASE_URL%/}/functions/v1"
          for i in $(seq 1 60); do
            resp=$(curl -s -m 280 -X POST "$BASE/enrich-artworks" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" -d '{}')
            echo "enrich #$i: $(echo "$resp" | head -c 200)" | tee -a /tmp/enrich.log
            echo "$resp" | grep -q 'need enrichment' && break
            remaining=$(echo "$resp" | grep -oE '"remaining":[0-9]+' | grep -oE '[0-9]+' || echo "")
            [ "$remaining" = "0" ] && break
            sleep 2
          done

      # New imports are inserted at score 0.01 so they never outrank scored
      # masterpieces; this gives them a real score (artist fame + image size) so
      # good works surface and reach the core sitemap. See rescore_new_imports().
      - name: Score new imports
        run: |
          curl -s -m 120 -X POST "${NEXT_PUBLIC_SUPABASE_URL%/}/rest/v1/rpc/rescore_new_imports" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{"max_age_days": 7}' | sed 's/^/rescored: /' | tee /tmp/score.log; echo

      # Safety net: catch any image that finished importing late (renditions are
      # produced inside the migrate step, so this only mops up stragglers).
      - name: Migrate stragglers to R2 (second pass)
        if: always()
        run: node scripts/migrate-new-to-r2.mjs --since-hours=6 --limit=600

      # Push the advanced cursor. Runs even if a later step failed, as long as the
      # import step itself produced a new cursor value worth keeping.
      - name: Commit advanced drip cursor
        if: always()
        run: |
          if git diff --quiet -- .github/state/drip-cursor.txt; then
            echo "No cursor change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/drip-cursor.txt
          git commit -m "chore: advance drip cursor [skip ci]"
          git pull --rebase origin main
          git push

      # Post a compact result row to _automation_runs so the run can be judged
      # without reading Actions logs (22 Sep 2026). Never fails the job.
      - name: Report run to DB
        if: always()
        run: |
          node scripts/report-automation-run.mjs "daily-import" "${{ job.status }}" /tmp/drip.log /tmp/plan.log /tmp/plan-import.log /tmp/migrate.log /tmp/enrich.log /tmp/score.log || true
