name: Daily image re-upgrade sweep

# Walks the catalogue by popularity, finds a higher-resolution scan of each
# low-res artwork on Wikimedia Commons, verifies it is the SAME painting
# (aspect ratio + perceptual hash), and replaces our copy — originals and
# renditions stored on Cloudflare R2 (never Supabase). Each work is stamped
# reup_checked_at so the sweep covers the whole catalogue once, then re-checks
# after the cooldown (Commons keeps gaining new scans).
#
# Runs at 04:00 UTC — after the 02:00 drip import and its rendition passes, so
# the two never contend. ~300 works/night; the full low-res backlog (~78k) is a
# months-long background grind by design.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Works to process this run"
        default: "300"
      max_src:
        description: "Only works narrower than this are candidates"
        default: "2000"

concurrency:
  group: daily-reupgrade
  cancel-in-progress: false

jobs:
  reupgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # Optional extra source. If unset the sweep is Commons-only (degrades cleanly).
      EUROPEANA_KEY: ${{ secrets.EUROPEANA_KEY }}
      REUP_DAILY: "1"
      REUP_LIMIT: ${{ github.event.inputs.limit || '300' }}
      REUP_MAX_SRC: ${{ github.event.inputs.max_src || '2000' }}
      REUP_MAX_WIDTH: "7000"
      REUP_COOLDOWN_DAYS: "90"
      REUP_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Re-upgrade sweep (Commons → R2, hash-verified)
        run: node scripts/reupgrade-commons-search.mjs
